name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install evaluator test dependencies
        run: python -m pip install pytest numpy pandas openpyxl

      - name: Run unit tests
        run: python -m pytest -q

      - name: Compile Game2Real VLMEvalKit integration
        run: |
          python -m py_compile VLMEvalKit/vlmeval/dataset/game2real_bench.py
          python -m py_compile VLMEvalKit/vlmeval/dataset/utils/game2real/toy.py
          python -m py_compile VLMEvalKit/vlmeval/dataset/utils/game2real/real.py
          python -m py_compile VLMEvalKit/vlmeval/dataset/image_mixedqa.py
          python -m py_compile VLMEvalKit/vlmeval/dataset/real_world_final.py
          python -m py_compile VLMEvalKit/utils/prepare_game2real_data.py

