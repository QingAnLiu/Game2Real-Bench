[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game2real-bench"
version = "1.0.0"
description = "Portable loaders and deterministic evaluators for Game2Real-Bench"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Game2Real-Bench Contributors"}]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/QingAnLiu/Game2Real-Bench"
Dataset = "https://huggingface.co/datasets/liuqa/Game2Real-Bench"
Issues = "https://github.com/QingAnLiu/Game2Real-Bench/issues"

[project.optional-dependencies]
hub = ["huggingface_hub>=0.25"]
test = ["pytest>=8"]

[project.scripts]
game2real-evaluate = "game2real.cli:main"

[tool.setuptools.packages.find]
include = ["game2real*"]
